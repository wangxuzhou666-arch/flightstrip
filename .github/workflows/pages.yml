# Publishes the static demo (npm run build:pages -> dist-pages/) to https://wangxuzhou666-arch.github.io/flightstrip/
# Needs Settings > Pages > Source = "GitHub Actions" in the repository once; this workflow does not change settings.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# What upload-pages-artifact and deploy-pages need: read the code, write the Pages site, mint the OIDC token deploy-pages checks
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a run already deploying is allowed to finish instead of being cut off by the next push
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
